name: Found
description: 'Found is a financial technology platform that combines free business
  banking, automated bookkeeping, tax tracking, and invoicing for self-employed people,
  freelancers, and small business owners. Banking services are provided through Lead
  Bank (Member FDIC), with FDIC insurance up to $250,000. Found consolidates a business
  checking account, a Mastercard business debit card, automatic expense categorization,
  real-time tax estimates, unlimited contractor payments, and an AI-powered bookkeeping
  assistant into a single mobile and web app. Paid Found Plus and Found Pro tiers add
  higher APY, cash back, and advanced tax and reporting features. Found is backed by
  Founders Fund, GV, IVP, and Lightspeed Venture Partners.'
